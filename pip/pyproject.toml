[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lapseCLI"
version = "1.0.0"
description = "A command line interface that allows for recording Hack Club Lapse timelapses from the command line."
requires-python = ">=3.15"
dependencies = [
    "authlib==1.9.5",
    "httpx2==2.16.2",
    "mss==10.2.0",
    "Pillow==13.0.0",
    "psutil==7.2.2",
]

[project.scripts]
lapseCLI = "lapseCLI:main"

[tool.setuptools]
packages = ["lapseCLI", "lapseCLI.utils"]
include-package-data = true

[tool.setuptools.package-dir]
lapseCLI = ".."

[tool.setuptools.package-data]
lapseCLI = ["config/*", "config/**/*", "temp/*", "temp/**/*"]
"lapseCLI.utils" = ["*"]